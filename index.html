<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OBS & TikTok Speedrun Timer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600&display=swap');

    :root {
      --bg-card: rgba(15, 15, 23, 0.85);
      --accent-color: #00ff88;
      --accent-pause: #ffaa00;
      --accent-death: #ff4d4d;
      --text-main: #ffffff;
      --text-muted: #a0a0b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: transparent;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      display: flex;
      padding: 10px;
      user-select: none;
    }

    .timer-card {
      position: relative;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--accent-color);
      border-radius: 12px;
      padding: 14px 20px;
      width: 380px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .timer-card.paused { border-left-color: var(--accent-pause); }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .game-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(0, 255, 136, 0.15);
      color: var(--accent-color);
      text-transform: uppercase;
    }

    .timer-card.paused .status-badge {
      background: rgba(255, 170, 0, 0.15);
      color: var(--accent-pause);
    }

    .timer-content-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 0 8px 0;
    }

    .time-display {
      font-family: 'Chakra Petch', sans-serif;
      display: flex;
      align-items: baseline;
    }

    .time-main { font-size: 3.2rem; font-weight: 700; }
    .time-ms { font-size: 1.4rem; font-weight: 600; color: var(--accent-color); margin-left: 4px; }
    .timer-card.paused .time-ms { color: var(--accent-pause); }

    .death-badge-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 77, 77, 0.12);
      border: 1px solid rgba(255, 77, 77, 0.25);
      padding: 4px 8px;
      border-radius: 8px;
      font-family: 'Chakra Petch', sans-serif;
    }

    .death-count-text { font-size: 1.25rem; font-weight: 700; color: var(--accent-death); }

    .death-quick-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }

    .controls-panel {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row { display: flex; gap: 8px; align-items: center; }

    button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.btn-primary { background: var(--accent-color); color: #0f0f13; border: none; }

    .timer-card.compact .controls-panel { display: none; }
    .timer-card.compact .time-main { font-size: 2.7rem; }
  </style>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="timer-card paused compact" id="timerCard">
    <div class="profile-header">
      <div class="game-title">Timer Live</div>
      <button onclick="toggleCompactMode()" style="font-size: 0.7rem; padding: 2px 6px;">⚙️ Controles</button>
      <div class="status-badge" id="statusBadge">Pausado</div>
    </div>

    <div class="timer-content-row">
      <div class="time-display">
        <div class="time-main" id="mainTime">00:00:00</div>
        <div class="time-ms" id="msTime">.00</div>
      </div>

      <div class="death-badge-container">
        <span>💀</span>
        <button class="death-quick-btn" onclick="changeDeaths(-1)">-</button>
        <span class="death-count-text" id="deathCountDisplay">0</span>
        <button class="death-quick-btn" onclick="changeDeaths(1)">+</button>
      </div>
    </div>

    <div class="controls-panel">
      <div class="row">
        <button class="btn-primary" style="flex: 1;" onclick="toggleTimer()">Start / Pause</button>
        <button onclick="resetTimer()">Zerar Tempo</button>
        <button onclick="resetDeaths()">Zerar Mortes</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Cole SUAS CHAVES DO FIREBASE AQUI
  const firebaseConfig = {
    apiKey: "AIzaSyA_xDYL3vVAQ8ZxurQll__-dWgx-X7Hf2U",
    authDomain: "timer-live-a061e.firebaseapp.com",
    databaseURL: "https://timer-live-a061e-default-rtdb.firebaseio.com",
    projectId: "timer-live-a061e",
    storageBucket: "timer-live-a061e.firebasestorage.app",
    messagingSenderId: "536127458192",
    appId: "1:536127458192:web:85462cfc4c43812038c115",
    measurementId: "G-S6GLJ6W2V9"
  };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('timerState');

    let elapsedTime = 0;
    let startTime = 0;
    let deathCount = 0;
    let isRunning = false;
    let timerInterval = null;

    // 2. ESCUTAR MUDANÇAS EM TEMPO REAL (Para o TikTok e navegador)
    db.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      elapsedTime = data.elapsedTime || 0;
      startTime = data.startTime || 0;
      deathCount = data.deathCount || 0;
      isRunning = data.isRunning || false;

      document.getElementById('deathCountDisplay').textContent = deathCount;

      if (isRunning) {
        document.getElementById('timerCard').classList.remove('paused');
        document.getElementById('statusBadge').textContent = 'Ao Vivo';
        if (!timerInterval) timerInterval = setInterval(updateDisplay, 10);
      } else {
        document.getElementById('timerCard').classList.add('paused');
        document.getElementById('statusBadge').textContent = 'Pausado';
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        updateDisplay();
      }
    });

    // 3. ENVIAR ATUALIZAÇÃO PARA O BANCO
    function sendStateToFirebase() {
      db.set({
        elapsedTime: elapsedTime,
        startTime: startTime,
        deathCount: deathCount,
        isRunning: isRunning,
        updatedAt: Date.now()
      });
    }

    function updateDisplay() {
      const totalMs = isRunning ? (elapsedTime + (Date.now() - startTime)) : elapsedTime;
      const ms = Math.floor((totalMs % 1000) / 10);
      const totalSec = Math.floor(totalMs / 1000);
      const sec = totalSec % 60;
      const min = Math.floor(totalSec / 60) % 60;
      const hrs = Math.floor(totalSec / 3600);

      const pad = (n, len = 2) => String(n).padStart(len, '0');
      document.getElementById('mainTime').textContent = `${pad(hrs)}:${pad(min)}:${pad(sec)}`;
      document.getElementById('msTime').textContent = `.${pad(ms, 2)}`;
    }

    function toggleTimer() {
      const now = Date.now();
      if (isRunning) {
        elapsedTime += (now - startTime);
        isRunning = false;
      } else {
        startTime = now;
        isRunning = true;
      }
      sendStateToFirebase();
    }

    function resetTimer() {
      isRunning = false;
      elapsedTime = 0;
      startTime = 0;
      sendStateToFirebase();
    }

    function changeDeaths(delta) {
      deathCount = Math.max(0, deathCount + delta);
      sendStateToFirebase();
    }

    function resetDeaths() {
      deathCount = 0;
      sendStateToFirebase();
    }

    function toggleCompactMode() {
      document.getElementById('timerCard').classList.toggle('compact');
    }

    // Atalhos do teclado
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
      else if (e.code === 'KeyD') { e.preventDefault(); changeDeaths(e.shiftKey ? -1 : 1); }
      else if (e.code === 'KeyR') { e.preventDefault(); resetTimer(); }
    });
  </script>
</body>
</html>
